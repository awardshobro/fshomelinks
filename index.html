<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Star Remodeling By Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">
  <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
    
    <!-- Profile Avatar & Info -->
    <div class="w-24 h-24 rounded-full bg-amber-500/10 border-2 border-amber-500 flex items-center justify-center text-amber-400 text-3xl mb-4 shadow-lg shadow-amber-500/10">
      <i class="fa-solid fa-layer-group"></i>
    </div>
    
    <h1 class="text-2xl font-bold tracking-tight text-white text-center">Five Star Remodeling</h1>
    <p class="text-xs uppercase tracking-widest text-amber-400 font-semibold mt-1">By Design • Custom Tile & Remodeling</p>
    <p class="text-xs text-slate-400 mt-1 mb-5 flex items-center gap-1.5">
      <i class="fa-solid fa-location-dot text-amber-500"></i> Nassau & Western Suffolk County, NY
    </p>

    <!-- Review Badges (Top Priority) -->
    <div class="w-full space-y-3 mb-4">
      <!-- Once Paul provides his direct Google review link, paste it in href below -->
      <a href="https://www.google.com/search?q=Five+Star+Remodeling+By+Design+NY" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-between w-full p-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-2xl shadow-lg transition-transform active:scale-95">
        <span class="flex items-center gap-3">
          <i class="fa-brands fa-google text-lg"></i>
          <span>Leave a Review on Google</span>
        </span>
        <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
      </a>

      <a href="https://www.yelp.com/writeareview/biz/Q2czfCE0vLp8ttydJRGQ5A?return_url=%2Fbiz%2FQ2czfCE0vLp8ttydJRGQ5A&review_origin=biz-details-war-button" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-between w-full p-3.5 bg-red-600/10 border border-red-500/30 hover:bg-red-600/20 text-red-300 font-semibold rounded-2xl transition-transform active:scale-95">
        <span class="flex items-center gap-3">
          <i class="fa-brands fa-yelp text-lg text-red-500"></i>
          <span>Review Us on Yelp</span>
        </span>
        <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-50"></i>
      </a>
    </div>

    <!-- Contact & Action Buttons -->
    <div class="w-full space-y-2.5 mb-5">
      <a href="tel:+15169884416" 
         class="flex items-center justify-between w-full p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-700/80 rounded-2xl text-slate-200 transition">
        <span class="flex items-center gap-3">
          <i class="fa-solid fa-phone text-amber-400"></i>
          <span>Call (516) 988-4416 for an Estimate</span>
        </span>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
      </a>

      <a href="https://www.instagram.com/fivestarremodelingbydesigns/" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-between w-full p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-750/80 rounded-2xl text-slate-200 transition">
        <span class="flex items-center gap-3">
          <i class="fa-brands fa-instagram text-pink-400"></i>
          <span>Recent Work Portfolio</span>
        </span>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
      </a>

      <a href="https://www.facebook.com/people/Five-Star-Remodeling-By-Design/61595597354978/" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-between w-full p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-700/80 rounded-2xl text-slate-200 transition">
        <span class="flex items-center gap-3">
          <i class="fa-brands fa-facebook text-blue-400"></i>
          <span>Facebook Page</span>
        </span>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
      </a>
    </div>

    <!-- Footer -->
    <p class="text-[11px] text-slate-500 mt-2 text-center">Licensed & Insured Residential Contractor</p>
  </main>
</body>
</html>
